seed: 42

data:
  root: "F:/Junshoku/TST2K"
  manifest: "F:/Junshoku/TST2K/split_manifest.csv"
  image_size: 256
  batch_size: 2
  num_workers: 0
  augment: true

model:
  pretrained: true
  freeze_encoder: true
  hidden_dim: 256
  map_size: 64
  exposure_limit_ev: 2.0
  temperature_limit: 0.25
  tint_limit: 0.15
  contrast_limit: 0.5
  saturation_limit: 0.5
  hue_limit: 0.15

training:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  amp: true
  checkpoint_dir: "checkpoints/node_graph"

loss:
  reconstruction: 1.0
  map_smoothness: 0.02

inference:
  checkpoint: "checkpoints/node_graph/best.pt"
  input: "data/example/source.png"
  reference: "data/example/reference.png"
  output: "outputs/graded.png"
