seed: 42
data:
  root: "F:/Junshoku/TST2K"
  manifest: "F:/Junshoku/TST2K/split_manifest.csv"
  image_size: 256
  batch_size: 1
  num_workers: 0
  augment: false
model:
  pretrained: true
  freeze_encoder: true
  hidden_dim: 256
  map_size: 64
  map_initial_gate: 0.5
  map_min_gate: 0.05
  map_max_gate: 0.95
  exposure_limit_ev: 2.0
  temperature_limit: 0.25
  tint_limit: 0.15
  contrast_limit: 0.5
  saturation_limit: 0.5
  hue_limit: 0.15
synthetic:
  samples: 4000
  epochs: 5
  map_weight: 2.0
  param_weight: 1.0
  reconstruction_weight: 1.0
training:
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  amp: true
  synthetic_checkpoint_dir: "checkpoints/node_graph_synthetic"
  checkpoint_dir: "checkpoints/node_graph_finetuned"
loss:
  reconstruction: 1.0
  map_smoothness: 0.002
  map_variance: 0.0
  map_min_std: 0.0
inference:
  checkpoint: "checkpoints/node_graph_finetuned/best.pt"
  input: "data/example/source.png"
  reference: "data/example/reference.png"
  output: "outputs/graded.png"
